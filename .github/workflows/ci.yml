name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: POSIX (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Syntax check
        shell: sh
        run: sh -n install.sh bootstrap.sh tests/installer-posix.sh
      - name: Test
        shell: sh
        run: sh tests/installer-posix.sh

  windows-powershell:
    name: Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Parse and load installer
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content ./install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content ./bootstrap.ps1 -Raw))
          ./install.ps1 --help

  powershell:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test
        shell: pwsh
        run: ./tests/installer-powershell.ps1
